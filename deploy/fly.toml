app = "procurement-audit-lyh"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_MODEL = "claude-sonnet-5-5"
  RUNS_PER_DAY = "3"
  STAGE_BUDGET_USD = "6"

[mounts]
  source = "runs"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
